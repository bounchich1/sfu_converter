[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sfu-converter"
dynamic = ["version"]
description = "TXT to DOCX converter with SFU formatting standards (СТУ 7.5-07-2021)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nikita2005qwe", email = "noreply@github.com" }]
keywords = ["sfu", "сфу", "docx", "academic", "russian", "txt-to-docx", "report", "stu-7.5-07"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Russian",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup",
    "Topic :: Office/Business",
]
dependencies = [
    "python-docx>=1.1.0",
    "Pillow>=10.0.0",
]

[project.urls]
Homepage = "https://github.com/Nikita2005qwe/sfu_converter"
Repository = "https://github.com/Nikita2005qwe/sfu_converter"
Issues = "https://github.com/Nikita2005qwe/sfu_converter/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "coverage[toml]>=7.0",
    "ruff>=0.5.0",
]

[project.scripts]
sfu-converter = "sfu_converter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "sfu_converter.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "e2e: end-to-end profile fixture tests",
]

[tool.coverage.run]
source = ["sfu_converter"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_empty = true
exclude_also = [
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
